name: bayora

x-hello-service: &hello-service
  image: bayora/hello:phase1
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp=./seccomp/tenant.json
  user: "10001:10001"
  pids_limit: 64
  cpus: "1.0"
  mem_limit: 512m
  init: true
  ulimits:
    nofile: {soft: 1024, hard: 2048}
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  tmpfs:
    - /tmp:size=16m,noexec,nosuid,nodev
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  gateway:
    <<: *hello-service
    image: bayora/gateway:phase3
    build:
      context: .
      dockerfile: Dockerfile.gateway
      network: host
    environment:
      BAYORA_LLM_URL: "http://llm:11434"
      BAYORA_BLUE_URL: "http://blue:8082"
      BAYORA_MODEL: "qwen2.5:0.5b"
      BAYORA_JWT_PUBLIC_KEY: "/run/secrets/gateway_public.pem"
      BAYORA_AUDIT_URL: "http://audit:8081"
      BAYORA_TIMING_BUCKET_MS: "5000"
      BAYORA_BLUE_MODE: ${BAYORA_BLUE_MODE:-full}
      BAYORA_MAX_REQUEST_BYTES: "65536"
      BAYORA_RATE_LIMIT_REQUESTS: "20"
      BAYORA_RATE_LIMIT_WINDOW_SECONDS: "60"
    volumes:
      - ./secrets/gateway_public.pem:/run/secrets/gateway_public.pem:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [red_net, blue_net, model_net, audit_net]

  red:
    <<: *hello-service
    image: bayora/red:phase6
    build:
      context: .
      dockerfile: Dockerfile.red
      network: host
    networks: [red_net]

  blue:
    <<: *hello-service
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp/blue.json
    image: bayora/blue:phase5
    build:
      context: .
      dockerfile: Dockerfile.blue
      network: host
    environment:
      BAYORA_BLUE_PROFILE: ${BAYORA_BLUE_PROFILE:-full}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [blue_net]

  blue-test:
    <<: *hello-service
    profiles: [test]
    entrypoint: ["python"]
    volumes:
      - ./tests/phase5_blue_contract.py:/tests/phase5_blue_contract.py:ro
      - ./tests/phase9_blue_canary.py:/tests/phase9_blue_canary.py:ro
      - ./tests/phase11_blue_client.py:/tests/phase11_blue_client.py:ro
    networks: [blue_net]

  llm:
    <<: *hello-service
    image: ollama/ollama:0.6.8
    command: ["serve"]
    user: "10001:10001"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: "/models"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_NOHISTORY: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_TMPDIR: "/tmp"
      HOME: "/tmp"
      CUDA_VISIBLE_DEVICES: ""
    volumes:
      - ./models/ollama/models:/models:ro
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev,mode=1777
    cpus: "2.0"
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [model_net]

  llm-test:
    <<: *hello-service
    profiles: [test]
    entrypoint: ["python"]
    volumes:
      - ./llm_sandbox/client_test.py:/tests/client_test.py:ro
    networks: [model_net]

  audit:
    <<: *hello-service
    image: bayora/audit:phase4
    build:
      context: .
      dockerfile: Dockerfile.audit
      network: host
    environment:
      BAYORA_AUDIT_DIR: "/data"
      BAYORA_AUDIT_PRIVATE_KEY: "/run/secrets/audit_private.pem"
    volumes:
      - ./data/audit:/data
      - ./secrets/audit_private.pem:/run/secrets/audit_private.pem:ro
    group_add: ["1000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [audit_net, control_net]

  audit-test:
    <<: *hello-service
    profiles: [test]
    entrypoint: ["python"]
    volumes:
      - ./tests/phase4_audit_client.py:/tests/phase4_audit_client.py:ro
      - ./tests/phase6_commit_client.py:/tests/phase6_commit_client.py:ro
      - ./tests/phase7_audit_client.py:/tests/phase7_audit_client.py:ro
      - ./tests/phase9_control.py:/tests/phase9_control.py:ro
      - ./tests/phase10_timing_client.py:/tests/phase10_timing_client.py:ro
      - ./tests/phase10_fairness_client.py:/tests/phase10_fairness_client.py:ro
      - ./tests/phase12_audit_client.py:/tests/phase12_audit_client.py:ro
    networks: [audit_net]

  red-test:
    <<: *hello-service
    profiles: [test]
    entrypoint: ["python"]
    volumes:
      - ./tests/phase11_red_client.py:/tests/phase11_red_client.py:ro
    networks: [red_net]
    healthcheck: {disable: true}

  operator-test:
    <<: *hello-service
    profiles: [test]
    entrypoint: ["python"]
    volumes:
      - ./tests/phase11_operator_client.py:/tests/phase11_operator_client.py:ro
    networks: [control_net]
    healthcheck: {disable: true}

  orchestrator:
    <<: *hello-service
    environment: {BAYORA_ROLE: orchestrator}
    networks: [audit_net, control_net]

  evaluator:
    <<: *hello-service
    environment: {BAYORA_ROLE: evaluator}
    networks: [audit_net, control_net]

  dashboard:
    <<: *hello-service
    image: bayora/dashboard:phase11
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      network: host
    environment:
      BAYORA_PROMETHEUS_URL: "http://prometheus:9090"
    ports: ["127.0.0.1:8085:8085"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      prometheus:
        condition: service_started
    networks: [control_net]

  prometheus:
    <<: *hello-service
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /prometheus:size=128m,mode=1777
    healthcheck: {disable: true}
    depends_on:
      audit:
        condition: service_healthy
    networks: [control_net]

  secrets:
    <<: *hello-service
    environment: {BAYORA_ROLE: secrets}
    networks: [control_net]

networks:
  red_net: {internal: true}
  blue_net: {internal: true}
  model_net: {internal: true}
  audit_net: {internal: true}
  control_net: {internal: true}
